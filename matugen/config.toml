# Paperss palette targets.
# `retheme` renders these files from the selected wallpaper's colors.

[config]

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-palette.conf'
output_path = '~/.config/kitty/matugen-theme.conf'
post_hook = 'kitty @ --to unix:/tmp/kitty load-config 2>/dev/null || true'

[templates.gtk_colors]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.local/share/rice/gtk-colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk4.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk3.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.colors_json]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/share/rice/colors.json'
